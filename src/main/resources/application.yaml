spring:
  profiles:
    active: dev
  application:
    name: Hx-ai-life
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus
#     向量模型配置
      embedding:
        options:
          model: text-embedding-v3
    mcp:
      client:
        enabled: true
        request-timeout: 60s
        type: SYNC
        stdio:
          servers-configuration: classpath:mcp-servers.json

    vectorstore:
      elasticsearch:
        initialize-schema: true
        index-name: life-app-documents
        dimensions: 1024
        similarity: cosine
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: 2s
      timeout: 2s
    mongodb:
      uri: mongodb://localhost:27017/hx_ai_life
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/hx_ai_life?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Singapore}
    username: ${hxy.MYSQL_USERNAME}
    password: ${hxy.MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  elasticsearch:
    uris: http://localhost:9201
#      username:
#      password:


server:
  port: 8321
  servlet:
    context-path: /api

# Sa-Token 登录状态配置。sa-token-redis-jackson 会将 Token、会话和注销状态持久化到 Redis。
sa-token:
  token-name: Authorization
  token-prefix: Bearer
  timeout: 604800
  is-concurrent: true
  is-share: false
  is-log: true

# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match:
       - '/**'
      packages-to-scan:
       - com.hxy.hxailife.controller
# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: false
  setting:
    language: zh_cn

# Tools-Api
tools:
  search-api-key: ${hxy.search-api-key}
  dianping:
    api-url: http://127.0.0.1:8000
